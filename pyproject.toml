[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "leishgene"
version = "0.1.0"
description = "Search genes and annotations across Leishmania genomes from the leishref catalog"
authors = [{name = "Cokelaer", email = "cokelaer@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "leishref>=0.1",
    "rich-click>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "pre-commit>=3.0",
]

[project.scripts]
leishgene = "leishgene.cli:cli"

[tool.poetry]
name = "leishgene"
version = "0.1.0"
description = "Search genes and annotations across Leishmania genomes"
authors = ["Cokelaer <cokelaer@gmail.com>"]
readme = "README.md"
packages = [{include = "leishgene"}]

[tool.poetry.dependencies]
python = "^3.9"
leishref = ">=0.1"
rich-click = "^1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^23.0"
isort = "^5.0"
flake8 = "^6.0"
pre-commit = "^3.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:asyncio"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
