name: Publish gene search page

# Builds the gene index from the GFFs of the leishref catalog and publishes web/ with GitHub Pages.
# Installing the genomes downloads their FASTA as well as the GFF (leishref has no GFF-only install),
# so the leishref cache is kept between runs.

on:
  push:
    branches: [main]
    paths: ["leishgene/**", "web/**", "data/**", "pyproject.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install leishgene
        # leishref is not on PyPI yet: install it from GitHub first
        run: |
          pip install "git+https://github.com/leishome/leishref"
          pip install .
      - name: Install the NCBI datasets CLI
        # leishref downloads NCBI genomes through the `datasets` program
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/datasets" https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets
          chmod +x "$HOME/bin/datasets"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Key for the leishref download cache
        id: genomes
        run: echo "hash=$(leishgene info --list-gff-genomes | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the leishref cache
        # the cache holds the GFFs only (see below); a new key per run lets a partly filled cache be saved
        uses: actions/cache/restore@v4
        with:
          path: ~/.config/leishref
          key: leishref-${{ steps.genomes.outputs.hash }}-${{ github.run_id }}
          restore-keys: leishref-${{ steps.genomes.outputs.hash }}-
      - name: Install the genomes that have a GFF
        # NCBI's download service fails now and then, and `leishref install` reports it as "NCBI has no data":
        # retry each genome, skip the ones already cached, and keep only the GFF (leishgene never reads the FASTA)
        run: |
          for genome in $(leishgene info --list-gff-genomes); do
            dir="$HOME/.config/leishref/$genome"
            if ls "$dir"/*.gff > /dev/null 2>&1; then continue; fi
            for attempt in 1 2 3 4; do
              leishref install "$genome" --alias "$genome" --no-link && break
              if [ "$attempt" = 4 ]; then echo "::error::could not install $genome"; exit 1; fi
              echo "attempt $attempt failed for $genome, retrying"
              sleep $((attempt * 30))
            done
            rm -f "$dir"/*.fna "$dir"/*.fna.gz "$dir"/*.fai
          done
      - name: Save the leishref cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.config/leishref
          key: leishref-${{ steps.genomes.outputs.hash }}-${{ github.run_id }}
      - name: Build index
        # data/extra/gff_overrides.yaml adds GFFs the catalog lacks (Ld1S) and is read automatically
        run: |
          leishgene build --strict -i index
          leishgene export -i index -o web/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
