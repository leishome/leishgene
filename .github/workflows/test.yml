name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        # leishref is not on PyPI yet: install it from GitHub first, then leishgene
        run: |
          pip install "git+https://github.com/leishome/leishref"
          pip install -e ".[dev]"
      - name: Lint
        run: |
          black --check leishgene tests
          isort --check-only leishgene tests
          flake8 leishgene tests
      - name: Python tests
        run: pytest --cov=leishgene --cov-report=term-missing
      - name: JavaScript tests
        run: node --test web/tests/*.test.mjs
